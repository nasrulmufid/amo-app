# ════════════════════════════════════════════════════════════════════════════
#  Nginx: web statis + reverse proxy ke API (PRD §15.1)
#     /            → file statis React (SPA)
#     /api/v1/*    → API (Fastify)
#     /health*     → API
#     /remote/*    → API (remote proxy, Sprint 4)
#  TLS: lihat blok `server { listen 443 ssl; }` yang dikomentari di bawah, atau
#  taruh Caddy/Traefik/Nginx host di depan container ini dan set TRUST_PROXY=true.
# ════════════════════════════════════════════════════════════════════════════

# Dukungan WebSocket (UI perangkat via /remote bila diperlukan).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream amo_api { server api:4500; keepalive 16; }

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  client_max_body_size 2m;

  # ── Security headers untuk aplikasi web (CSP di API sengaja dimatikan) ──
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Aktifkan setelah TLS terpasang:
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # OpenFreeMap vector style, tiles, sprites & fonts; bundled MapLibre worker.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://tiles.openfreemap.org; worker-src 'self'; frame-ancestors 'none'" always;

  location /api/v1/ { proxy_pass http://amo_api; include /etc/nginx/conf.d/proxy_params.inc; }
  location /health   { proxy_pass http://amo_api; include /etc/nginx/conf.d/proxy_params.inc; }

  # Remote proxy: timeout lebih panjang, tanpa buffering agar UI perangkat terasa responsif.
  location /remote/ {
    proxy_pass http://amo_api;
    include /etc/nginx/conf.d/proxy_params.inc;
    proxy_read_timeout 120s;
    proxy_buffering off;
  }

  # Aset ber-hash dari Vite → cache lama; index.html → jangan di-cache.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / {
    try_files $uri /index.html;   # fallback SPA (React Router)
    add_header Cache-Control "no-cache";
  }
}

