# ════════════════════════════════════════════════════════════════════════════
#  AMO — Docker Compose (PRD §15)
#  Jalankan dari ROOT repo:   npm run docker:up
#     (= docker compose --env-file .env -f deploy/compose.yml up -d --build)
#  Topologi: hanya `web` (Nginx) yang membuka port ke luar. MySQL & API
#  berada di jaringan internal (PRD §15.2: "Jangan expose port MySQL").
# ════════════════════════════════════════════════════════════════════════════
name: amo

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    # Zona waktu server DB = UTC (konsisten dengan aplikasi, PRD §8.3).
    command: ["--default-time-zone=+00:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?isi MYSQL_ROOT_PASSWORD di .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-amo}
      MYSQL_USER: ${MYSQL_USER:-amo_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?isi MYSQL_PASSWORD di .env}
    volumes:
      - mysql_data:/var/lib/mysql # volume persisten (PRD §15.2)
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [internal]

  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
    env_file: ../.env
    environment:
      NODE_ENV: production
      # Di Docker, host DB = nama service `mysql` (bukan 127.0.0.1):
      DATABASE_URL: mysql://${MYSQL_USER:-amo_user}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-amo}
      TRUST_PROXY: "true" # API berada di belakang Nginx milik compose ini
    networks: [internal]
    # Remote proxy & GenieACS NBI membutuhkan jalur ke jaringan manajemen ONU.
    # Definisikan `mgmt` sebagai network external/macvlan sesuai topologi Anda, lalu
    # tambahkan ke service `api` di bawah. Tanpa ini, remote akan ditolak kebijakan
    # (REMOTE_ALLOWED_CIDRS kosong = tidak ada target diizinkan).
    # networks: [internal, mgmt]

  web:
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      # - "443:443"   # aktifkan bersama blok TLS di deploy/nginx/default.conf
    networks: [internal]

volumes:
  mysql_data:

networks:
  internal:
